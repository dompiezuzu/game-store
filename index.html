<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store</title>

    <style>
        body{
            margin:0;
            font-family:Arial;
            background:#0f172a;
            color:white;
        }

        header{
            background:#111827;
            padding:20px;
            text-align:center;
            border-bottom:2px solid #1e293b;
        }

        h1{
            margin:0;
            color:#60a5fa;
        }

        .hero{
            text-align:center;
            padding:40px 20px;
        }

        .search{
            width:80%;
            max-width:300px;
            padding:12px;
            border:none;
            border-radius:10px;
        }

        .games{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
            gap:15px;
            padding:20px;
        }

        .card{
            background:#1e293b;
            border-radius:15px;
            padding:15px;
            text-align:center;
        }

        .card img{
            width:100%;
            border-radius:10px;
        }

        button{
            background:#3b82f6;
            color:white;
            border:none;
            padding:10px 15px;
            border-radius:8px;
        }
    </style>
</head>
<body>

<header>
    <h1>🎮 DOMPIE STORE</h1>
</header>

<div class="hero">
    <h2>Game Terbaik, Harga Terbaik</h2>
    <input class="search" placeholder="Cari game...">
</div>

<div class="games">

    <div class="card">
        <img src="https://picsum.photos/300/200?1">
        <h3>Buddha Fruit</h3>
        <p>Rp 5.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/200?2">
        <h3>Portal</h3>
        <p>Rp 5.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/200?3">
        <h3>Cyberpunk 2077</h3>
        <p>Rp 250.000</p>
        <button>Beli</button>
    </div>

</div>

</body>
</html>
